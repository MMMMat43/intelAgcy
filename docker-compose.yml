#
# Единый стек IntelligentTestAgent: наш Kotlin REST API сервер (Ktor) + n8n
# (low-code платформа) в одной Docker Compose сети.
#
# Запуск ОДНОЙ командой (поднимет оба сервиса, соберёт образ агента, если
# нужно):
#   docker compose up --build -d
#   (или проще: .\run.ps1 up)
#
# Первая сборка образа агента может занять несколько минут - скачиваются
# базовые Docker-образы (eclipse-temurin, n8n) и зависимости Gradle внутри
# контейнера сборки. Повторные запуски намного быстрее благодаря кэшу
# слоёв Docker.
#
# LLM (генерация дополнительных тестовых сценариев через нейросеть) -
# полностью опциональна. Без файла .env агент работает на чистых
# эвристиках. Чтобы включить реальный вызов LLM, скопируйте .env.example
# в .env и впишите туда данные ЛЮБОГО OpenAI-совместимого API (например,
# бесплатного - см. .env.example и README.md). Секреты в .env не
# коммитятся (см. .gitignore).
#
# Остановить:
#   docker compose down
#   (или: .\run.ps1 down)
#
# Логи:
#   docker compose logs -f agent
#   docker compose logs -f n8n
#
# После запуска:
#   - наш REST API:  http://localhost:8080/health
#   - интерфейс n8n: http://localhost:5678

services:
  agent:
    build: .
    container_name: intelligent-test-agent-server
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      # Без .env - пусто, LLM выключен, работают только эвристики.
      # Впишите свои значения в .env (см. .env.example), чтобы включить
      # реальный вызов LLM через любой OpenAI-совместимый API.
      - LLM_API_KEY=${LLM_API_KEY:-}
      - LLM_MODEL=${LLM_MODEL:-gpt-4o-mini}
      - LLM_API_BASE_URL=${LLM_API_BASE_URL:-https://api.openai.com/v1}
    volumes:
      # Примеры Kotlin-файлов для демонстрации (доступны агенту по пути
      # /data/samples/... - см. integration/n8n/workflow.json).
      - ./src/test/resources:/data/samples:ro
      # Сюда агент сохраняет сгенерированные артефакты (analysis.json,
      # test-cases.json, сгенерированный Kotlin-код тестов). Папка
      # ./build/agent-output появится на хосте автоматически.
      - ./build/agent-output:/data/output
      # Файлы, загруженные через POST /generate-tests-upload (см. Routes.kt).
      - ./build/agent-uploads:/data/uploads

  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: intelligent-test-agent-n8n
    restart: unless-stopped
    depends_on:
      - agent
    ports:
      - "5678:5678"
    environment:
      - N8N_SECURE_COOKIE=false
      - GENERIC_TIMEZONE=Europe/Moscow
    volumes:
      - n8n_data:/home/node/.n8n

volumes:
  n8n_data:
